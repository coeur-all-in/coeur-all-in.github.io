<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Cœur All In</title>
  <meta name="description" content="Pas de photo, pas de swipe. Un soir, une personne, et des cartes pour jouer le rendez-vous.">
  <meta name="theme-color" content="#09090f">
  <script>
    // Thème appliqué avant l'affichage pour éviter un flash.
    (function () {
      var t = 'minuit';
      try { t = JSON.parse(localStorage.getItem('cai.theme')) || t; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
      var f = '';
      try { f = JSON.parse(localStorage.getItem('cai.font')) || ''; } catch (e) {}
      if (f) document.documentElement.setAttribute('data-font', f);
    })();
  </script>
  
  <link rel="manifest" href="manifest.webmanifest">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cœur All In">
  <link rel="preconnect" href="https://fonts.googleapis.com">
